definitions:
  libmozhi.LangOut:
    properties:
      detected:
        type: string
      engine:
        type: string
      source_language:
        type: string
      target_language:
        type: string
      translated-text:
        type: string
      word_choices:
        items:
          $ref: '#/definitions/libmozhi.WordChoices'
        type: array
    type: object
  libmozhi.List:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  libmozhi.WordChoices:
    properties:
      examples_source:
        items:
          type: string
        type: array
      examples_target:
        items:
          type: string
        type: array
      word:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/engines:
    get:
      description: Lists available Engines.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List engines
  /api/source_languages:
    get:
      parameters:
      - description: Engine name
        in: query
        name: engine
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libmozhi.List'
      summary: Show list of available source languages for engine
  /api/target_languages:
    get:
      parameters:
      - description: Engine name
        in: query
        name: engine
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libmozhi.List'
      summary: Show list of available target languages for engine
  /api/translate:
    get:
      description: When engine is set to all, it will return an array of libmozhi.LangOut.
      parameters:
      - description: Engine name
        in: query
        name: engine
        required: true
        type: string
      - description: Source language
        in: query
        name: from
        required: true
        type: string
      - description: Target language
        in: query
        name: to
        required: true
        type: string
      - description: Text being translated
        in: query
        name: text
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libmozhi.LangOut'
      summary: Translate text
  /api/tts:
    get:
      parameters:
      - description: Engine name
        in: query
        name: engine
        required: true
        type: string
      - description: Language being TTS'd
        in: query
        name: lang
        required: true
        type: string
      - description: Text being TTS'd
        in: query
        name: text
        required: true
        type: string
      responses: {}
      summary: Get Text-To-Speech for specified language using specified engine
swagger: "2.0"
