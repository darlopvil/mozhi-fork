definitions:
  libmozhi.ImgOut:
    properties:
      sourceB64:
        type: string
      sourceLang:
        type: string
      sourceTextParsed:
        type: string
      targetLang:
        type: string
      translatedImgB64:
        type: string
      translatedTextParsed:
        type: string
    type: object
  libmozhi.JaDict:
    properties:
      entries:
        items:
          $ref: '#/definitions/libmozhi.JaDictEntry'
        type: array
      error:
        type: string
      lang:
        description: 'language of the senses: en, zh or ja'
        type: string
      name:
        type: string
      source:
        type: string
      url:
        description: the full entry on the source's website
        type: string
    type: object
  libmozhi.JaDictEntry:
    properties:
      accent:
        description: 'MOJi: pitch accent (⓪ flat, ① ② ... downstep after that mora)'
        type: string
      note:
        description: 'jpdb: "Conjugated as: past"; Weblio: grammar line'
        type: string
      reading:
        type: string
      romaji:
        type: string
      senses:
        items:
          $ref: '#/definitions/libmozhi.JaDictSense'
        type: array
      tags:
        items:
          type: string
        type: array
      word:
        type: string
    type: object
  libmozhi.JaDictExample:
    properties:
      japanese:
        type: string
      translation:
        type: string
    type: object
  libmozhi.JaDictSense:
    properties:
      examples:
        items:
          $ref: '#/definitions/libmozhi.JaDictExample'
        type: array
      glosses:
        items:
          type: string
        type: array
      pos:
        type: string
    type: object
  libmozhi.LangOut:
    properties:
      detected:
        type: string
      engine:
        type: string
      source_antonyms:
        items:
          type: string
        type: array
      source_equivalent_target_lang:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      source_language:
        type: string
      source_synonyms:
        items:
          type: string
        type: array
      source_transliteration:
        type: string
      target_antonyms:
        items:
          type: string
        type: array
      target_equivalent_source_lang:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      target_language:
        type: string
      target_synonyms:
        items:
          type: string
        type: array
      target_transliteration:
        type: string
      translated-text:
        type: string
      word_choices:
        items:
          $ref: '#/definitions/libmozhi.WordChoices'
        type: array
    type: object
  libmozhi.List:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  libmozhi.WordChoices:
    properties:
      definition:
        type: string
      example:
        description: Example is for google alone; since it does not have a linked
          example for source & target
        type: string
      examples_source:
        items:
          type: string
        type: array
      examples_target:
        items:
          type: string
        type: array
      word:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/engines:
    get:
      description: Lists available Engines.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List engines
  /api/health:
    get:
      description: 'Without engine: every enabled engine and dictionary, always 200.
        With engine: that one only, re-checked first if it is failing, has had no
        request since start or none for 12 hours (at most every 2 minutes), and 503
        while it is failing.'
      parameters:
      - description: Engine or dictionary name (jisho, jpdb, moji, weblio), or edge
          (Edge's voices)
        in: query
        name: engine
        type: string
      - description: 'translate, tts or dict (default: the first one it has)'
        in: query
        name: kind
        type: string
      responses: {}
      summary: Health of the enabled engines and Japanese dictionaries, from real
        traffic
  /api/image:
    post:
      description: When engine is set to all, it will return an array of libmozhi.LangOut.
      parameters:
      - description: Engine name
        in: formData
        name: engine
        required: true
        type: string
      - description: Source language
        in: formData
        name: from
        required: true
        type: string
      - description: Target language
        in: formData
        name: to
        required: true
        type: string
      - description: PNG image
        in: formData
        name: image
        required: true
        type: file
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libmozhi.ImgOut'
      summary: Translate an image
  /api/jadict:
    get:
      description: Jisho, jpdb, MOJi and Weblio, at once. A source that doesn't have
        the word answers no entries; one that fails answers its error.
      parameters:
      - description: Japanese word or short phrase (at most 15 characters)
        in: query
        name: word
        required: true
        type: string
      - description: 'Comma-separated sources (default: every enabled one)'
        in: query
        name: sources
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/libmozhi.JaDict'
            type: array
      summary: Look up a Japanese word in the Japanese dictionaries
  /api/source_languages:
    get:
      parameters:
      - description: Engine name
        in: query
        name: engine
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libmozhi.List'
      summary: Show list of available source languages for engine
  /api/target_languages:
    get:
      parameters:
      - description: Engine name
        in: query
        name: engine
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libmozhi.List'
      summary: Show list of available target languages for engine
  /api/translate:
    get:
      description: When engine is set to all, it will return an array of libmozhi.LangOut.
      parameters:
      - description: Engine name
        in: query
        name: engine
        required: true
        type: string
      - description: Source language
        in: query
        name: from
        required: true
        type: string
      - description: Target language
        in: query
        name: to
        required: true
        type: string
      - description: Text being translated
        in: query
        name: text
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/libmozhi.LangOut'
      summary: Translate text
  /api/tts:
    get:
      parameters:
      - description: Engine name
        in: query
        name: engine
        required: true
        type: string
      - description: Language being TTS'd
        in: query
        name: lang
        required: true
        type: string
      - description: Text being TTS'd
        in: query
        name: text
        required: true
        type: string
      responses: {}
      summary: Get Text-To-Speech for specified language using specified engine
swagger: "2.0"
